<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달력 상태별 화면 · 가계부 톡톡</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:#f0f3f1;color:#20342b;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}h2{margin:0 0 10px}.subtitle{color:#66766e;line-height:1.6}.archive-banner{max-width:1080px;margin:0 auto 20px;padding:12px 16px;background:white;border:1px solid #d7e7e0;border-radius:12px;font-size:13px;line-height:1.6}.archive-banner a{color:#356f5b}.approval{display:none!important}.dialog .warning-icon{margin-left:auto;margin-right:auto}
</style></head><body><aside class="archive-banner"><a href="index.html">목업 모음</a> · 달력 상태별 화면<br>승인 화면 보존본 · 정적 시안이며 실제 저장/인증은 동작하지 않습니다. 최신 정책은 <a href="../guide/PRD.md">PRD</a>와 <a href="../guide/Design.md">Design</a>를 따릅니다.</aside>
<style>
  .recommendation { display:flex; align-items:flex-start; gap:10px; max-width:820px; margin:14px auto 22px; padding:12px 14px; border-radius:14px; color:#34584a; background:#e9f5f0; }
  .recommendation b { flex:0 0 auto; padding:3px 7px; border-radius:999px; color:#fff; background:#4f9a80; font-size:11px; }
  .recommendation span { font-size:13px; line-height:1.5; }
  .state-grid { display:grid; grid-template-columns:repeat(2,390px); gap:28px; justify-content:center; align-items:start; }
  .state-case { min-width:0; }
  .case-head { display:flex; align-items:center; gap:8px; margin:0 4px 9px; }
  .case-no { display:grid; place-items:center; width:25px; height:25px; border-radius:50%; color:#fff; background:#4f9a80; font-size:12px; font-weight:900; }
  .case-head strong { font-size:14px; }
  .case-head small { margin-left:auto; color:#75847d; font-size:11px; }
  .phone { position:relative; width:390px; min-height:844px; overflow:hidden; border:1px solid #d6dfdb; border-radius:30px; background:#f5faf8; color:#24352f; box-shadow:0 15px 38px rgba(31,62,52,.10); }
  .status { display:flex; justify-content:space-between; padding:9px 17px 2px; font-size:10px; font-weight:800; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:7px 16px 6px; }
  .brand { font-size:18px; font-weight:950; }
  .filter-icon { display:grid; place-items:center; padding:4px; border:0; color:#286b55; background:transparent; }
  .filter-icon svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .total { display:flex; align-items:baseline; justify-content:space-between; min-height:35px; margin:0 15px 5px; padding:5px 2px; border-bottom:1px solid #dfe9e4; }
  .total span { color:#66776f; font-size:10px; font-weight:750; }
  .total strong { font-size:17px; }
  .month { display:flex; justify-content:space-between; padding:5px 18px 8px; font-size:14px; font-weight:950; }
  .calendar { margin:0 8px; padding:12px 7px 10px; border-radius:19px; background:#fff; box-shadow:0 5px 16px rgba(31,62,52,.06); }
  .week,.dates { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .week { margin-bottom:5px; color:#7d8984; font-size:9px; font-weight:800; }
  .week span:first-child { color:#d07b77; }
  .week span:last-child { color:#668fb1; }
  .day { min-height:56px; padding:7px 1px 4px; border-radius:10px; font-size:11px; box-sizing:border-box; }
  .day.muted { color:#c0c7c3; }
  .day em { display:block; margin-top:9px; color:#397962; font-size:8px; font-style:normal; font-weight:800; }
  .low { background:#f2f8f5; }
  .mid { background:#e7f4ef; }
  .high { background:#d5ece3; }
  .day.on { color:#174d3b; background:#c7e7da; font-weight:950; box-shadow:inset 0 0 0 2px #4f9a80; }
  .daily { margin:11px 13px 74px; }
  .daily-head { display:flex; justify-content:space-between; padding:0 2px 7px; }
  .daily-head strong { font-size:13px; }
  .daily-head span { color:#347b63; font-size:12px; font-weight:900; }
  .tx { display:grid; grid-template-columns:25px auto 1fr auto; gap:6px; align-items:center; margin-bottom:6px; padding:9px 10px; border-radius:12px; background:#fff; white-space:nowrap; }
  .icon { display:grid; place-items:center; width:24px; height:24px; border-radius:8px; background:#edf6f2; font-size:12px; }
  .cat { color:#3c5b50; font-size:9px; font-weight:900; }
  .memo { overflow:hidden; color:#707d77; font-size:9px; text-overflow:ellipsis; }
  .price { font-size:10px; font-weight:950; }
  .fab { position:absolute; right:17px; bottom:82px; display:grid; place-items:center; width:49px; height:49px; border-radius:50%; color:#fff; background:#4f9a80; font-size:23px; box-shadow:0 8px 18px rgba(79,154,128,.35); }
  .pill-nav { position:absolute; left:50%; bottom:12px; display:grid; grid-template-columns:repeat(3,1fr); width:214px; height:55px; padding:4px 8px; transform:translateX(-50%); border:1px solid rgba(214,219,217,.95); border-radius:999px; background:rgba(255,255,255,.94); box-shadow:0 8px 24px rgba(21,32,28,.20); }
  .nav-button { display:grid; place-items:center; border:0; color:#69736f; background:transparent; }
  .nav-button span { display:grid; place-items:center; width:42px; height:39px; border-radius:999px; }
  .nav-button svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav-button.on { color:#173c30; }
  .nav-button.on span { background:#dfeee8; }
  .nav-button.on svg { stroke-width:2.25; }
  .empty-daily { display:flex; align-items:center; justify-content:center; min-height:48px; border-radius:12px; color:#74827b; background:#fff; font-size:11px; }
  .error-daily { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:10px; border-radius:12px; color:#684f44; background:#fff4ee; }
  .error-daily b { font-size:10px; }
  .error-daily small { display:block; margin-top:2px; color:#876f64; font-size:9px; }
  .retry { padding:7px 9px; border:0; border-radius:8px; color:#fff; background:#9b6a55; font-size:9px; font-weight:900; }
  .notice { display:flex; align-items:flex-start; gap:7px; margin:0 13px 6px; padding:9px 10px; border-radius:11px; color:#5c5142; background:#fff4dc; font-size:10px; line-height:1.4; }
  .total-sk { display:block; width:116px; height:18px; border-radius:6px; background:#dfe8e4; }
  .amount-sk { display:block; width:70%; height:7px; margin:9px auto 0; border-radius:999px; background:#dfe8e4; }
  .tx-sk { height:42px; margin-bottom:6px; border-radius:12px; background:#e5ece9; }
  .loading-text { color:#718078 !important; }
  .review-option { max-width:590px; margin:24px auto 0; }
  @media(max-width:860px){.state-grid{grid-template-columns:390px}}
  @media(max-width:430px){.state-grid{grid-template-columns:minmax(0,390px)}.phone{width:100%}}
</style>

<h2>확정 달력 기반 상태 화면</h2>
<p class="subtitle">기존 월간 달력 최종안은 그대로 유지하고 데이터가 바뀌는 부분만 상태별로 교체합니다.</p>

<div class="recommendation"><b>추천</b><span>달력의 레이아웃과 날짜는 항상 유지합니다. 로딩·빈 값·오류는 월 총지출과 오늘 지출 영역에만 표시하고, 권한 상실 시 개인 가계부 달력으로 이동합니다.</span></div>

<div id="confirmed-calendar-states" class="state-grid"></div>

<div class="option review-option" data-choice="approve-confirmed-calendar-states">
  <div class="letter">✓</div>
  <div class="content"><h3>확정 달력 기반 상태 처리로 진행</h3><p>기존 메인 화면을 변경하지 않고 데이터 영역에만 상태를 적용합니다.</p></div>
</div>

<script>
  (() => {
    const states = [
      { key:'loading', no:'1', title:'로딩', note:'금액만 스켈레톤' },
      { key:'empty', no:'2', title:'지출 없음', note:'달력 그대로' },
      { key:'error', no:'3', title:'조회 오류', note:'오늘 지출에서 재시도' },
      { key:'permission', no:'4', title:'권한 상실', note:'개인 달력으로 이동' }
    ];
    const dates = [
      {d:'30',muted:true},{d:'31',muted:true},{d:'1',amount:'24,000',level:'mid'},{d:'2'},{d:'3',amount:'8,500',level:'low'},{d:'4'},{d:'5',amount:'41,000',level:'high'},
      {d:'6'},{d:'7',amount:'17,800',level:'mid'},{d:'8'},{d:'9',amount:'65,000',level:'high'},{d:'10'},{d:'11'},{d:'12',amount:'22,000',level:'mid'},
      {d:'13'},{d:'14',amount:'12,300',level:'mid'},{d:'15'},{d:'16',amount:'28,000',level:'mid'},{d:'17'},{d:'18',amount:'9,500',level:'low'},{d:'19'},
      {d:'20',amount:'35,800',on:true},{d:'21'},{d:'22'},{d:'23'},{d:'24'},{d:'25'},{d:'26'},
      {d:'27'},{d:'28'},{d:'29'},{d:'30'},{d:'1',muted:true},{d:'2',muted:true},{d:'3',muted:true}
    ];
    const icons = `<nav class="pill-nav" aria-label="주요 화면"><button class="nav-button on" aria-label="가계부"><span><svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 7h16M15 12h5"/></svg></span></button><button class="nav-button" aria-label="통계"><span><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span></button><button class="nav-button" aria-label="설정"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span></button></nav>`;

    function calendarFor(key) {
      const showData = key === 'permission';
      const cells = dates.map((item) => {
        const classes = ['day'];
        if (item.muted) classes.push('muted');
        if (showData && item.level) classes.push(item.level);
        if (item.on) classes.push('on');
        let detail = '';
        if (key === 'loading' && item.amount) detail = '<i class="amount-sk"></i>';
        if (showData && item.amount) detail = `<em>${item.amount}</em>`;
        return `<span class="${classes.join(' ')}">${item.d}${detail}</span>`;
      }).join('');
      return `<div class="calendar"><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="dates">${cells}</div></div>`;
    }

    function dailyFor(key) {
      if (key === 'loading') return `<div class="daily"><div class="daily-head"><strong>오늘 지출 · 9월 20일</strong><span class="loading-text">불러오는 중</span></div><div class="tx-sk"></div><div class="tx-sk"></div></div>`;
      if (key === 'empty') return `<div class="daily"><div class="daily-head"><strong>오늘 지출 · 9월 20일</strong><span>0원</span></div><div class="empty-daily">🎉&nbsp; 무지출에 성공하셨어요!</div></div>`;
      if (key === 'error') return `<div class="daily"><div class="daily-head"><strong>오늘 지출 · 9월 20일</strong><span>—</span></div><div class="error-daily"><span>!</span><span><b>지출 내역을 불러오지 못했어요</b><small>선택 날짜는 유지됩니다.</small></span><button class="retry">재시도</button></div></div>`;
      return `<div class="daily"><div class="daily-head"><strong>오늘 지출 · 9월 20일</strong><span>35,800원</span></div><div class="tx"><span class="icon">🍚</span><span class="cat">식비</span><span class="memo">저녁 식사</span><span class="price">-12,000원</span></div><div class="tx"><span class="icon">🛒</span><span class="cat">생활</span><span class="memo">생활용품</span><span class="price">-23,800원</span></div></div>`;
    }

    function phoneFor(state) {
      const total = state.key === 'loading' ? '<i class="total-sk"></i>' : state.key === 'empty' ? '0원' : state.key === 'error' ? '—' : '482,000원';
      const notice = state.key === 'permission' ? '<div class="notice"><b>!</b><span>이 그룹을 볼 수 없어 개인 가계부로 이동했습니다.</span></div>' : '';
      return `<section class="state-case"><div class="case-head"><span class="case-no">${state.no}</span><strong>${state.title}</strong><small>${state.note}</small></div><div class="phone"><div class="status"><span>9:41</span><span>● ● ●</span></div><div class="top"><span class="brand">가계부 톡톡</span><button class="filter-icon" aria-label="필터"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg></button></div>${notice}<div class="total"><span>9월 총지출</span><strong>${total}</strong></div><div class="month"><span>‹</span><span>2026년 9월</span><span>›</span></div>${calendarFor(state.key)}${dailyFor(state.key)}<div class="fab">＋</div>${icons}</div></section>`;
    }

    document.getElementById('confirmed-calendar-states').innerHTML = states.map(phoneFor).join('');
  })();
</script>

</body></html>
