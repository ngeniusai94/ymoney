<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>테마 선택 B안 · 가계부 톡톡</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:#f0f3f1;color:#20342b;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}h2{margin:0 0 10px}.subtitle{color:#66766e;line-height:1.6}.archive-banner{max-width:1080px;margin:0 auto 20px;padding:12px 16px;background:white;border:1px solid #d7e7e0;border-radius:12px;font-size:13px;line-height:1.6}.archive-banner a{color:#356f5b}.approval{display:none!important}.dialog .warning-icon{margin-left:auto;margin-right:auto}
</style></head><body><aside class="archive-banner"><a href="index.html">목업 모음</a> · 테마 선택 B안<br>승인 화면 보존본 · 정적 시안이며 실제 저장/인증은 동작하지 않습니다. 최신 정책은 <a href="../guide/PRD.md">PRD</a>와 <a href="../guide/Design.md">Design</a>를 따릅니다.</aside>
<div id="theme-picker-layout-comparison"><style>
    #theme-picker-layout-comparison {
      --ym-bg: light-dark(#f4f7f6, #171b19);
      --ym-text: light-dark(#22332c, #edf4f1);
      --ym-muted: light-dark(#708078, #9caaa4);
      --ym-line: light-dark(#dbe5e0, #38423e);
      --ym-surface: light-dark(#ffffff, #232a27);
      color: var(--ym-text);
    }
    #theme-picker-layout-comparison * { box-sizing: border-box; }
    #theme-picker-layout-comparison .intro { margin-bottom: 16px; }
    #theme-picker-layout-comparison .intro h2 { margin-bottom: 4px; }
    #theme-picker-layout-comparison .intro p { margin: 0; color: var(--ym-muted); }
    #theme-picker-layout-comparison .comparison {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }
    #theme-picker-layout-comparison .candidate {
      min-width: 0;
      padding: 10px;
      border: 2px solid transparent;
      border-radius: 24px;
      background: transparent;
      transition: border-color .15s ease, background .15s ease;
    }
    #theme-picker-layout-comparison .candidate.is-selected {
      border-color: light-dark(#4f8f78, #82bca6);
      background: light-dark(rgba(79,143,120,.08), rgba(130,188,166,.10));
    }
    #theme-picker-layout-comparison .candidate-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 2px 10px;
    }
    #theme-picker-layout-comparison .letter {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #ffffff;
      background: #4f8f78;
      font-weight: 500;
    }
    #theme-picker-layout-comparison .candidate-head strong { font-weight: 500; }
    #theme-picker-layout-comparison .phone {
      position: relative;
      min-height: 570px;
      overflow: hidden;
      border: 1px solid var(--ym-line);
      border-radius: 24px;
      background: #f5f8f7;
      color: #21352d;
      box-shadow: 0 12px 30px rgba(30, 55, 45, .12);
    }
    #theme-picker-layout-comparison .status {
      display: flex;
      justify-content: space-between;
      padding: 11px 14px 4px;
      background: #ffffff;
      font-size: 12px;
      font-weight: 500;
    }
    #theme-picker-layout-comparison .app-head {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid #e1e9e5;
      background: #ffffff;
      font-weight: 500;
    }
    #theme-picker-layout-comparison .app-body { padding: 15px 13px 82px; }
    #theme-picker-layout-comparison .current-label {
      margin: 0 2px 9px;
      color: #6a7a72;
      font-size: 12px;
    }
    #theme-picker-layout-comparison .grid-picker {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    #theme-picker-layout-comparison .theme-card,
    #theme-picker-layout-comparison .theme-row,
    #theme-picker-layout-comparison .theme-dot {
      font: inherit;
    }
    #theme-picker-layout-comparison .theme-card {
      position: relative;
      min-height: 96px;
      padding: 11px;
      border: 1px solid #dce5e1;
      border-radius: 14px;
      color: #263a32;
      background: #ffffff;
      text-align: left;
    }
    #theme-picker-layout-comparison .theme-card.selected {
      border-color: #4f8f78;
      box-shadow: inset 0 0 0 1px #4f8f78;
    }
    #theme-picker-layout-comparison .theme-card .check {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      color: #ffffff;
      background: #4f8f78;
      font-size: 12px;
    }
    #theme-picker-layout-comparison .theme-name { display: block; margin-bottom: 11px; font-weight: 500; }
    #theme-picker-layout-comparison .palette { display: flex; gap: 5px; }
    #theme-picker-layout-comparison .swatch { width: 24px; height: 24px; border-radius: 7px; }
    #theme-picker-layout-comparison .mint .swatch:nth-child(1) { background: #f2fbf7; }
    #theme-picker-layout-comparison .mint .swatch:nth-child(2) { background: #d7f0e5; }
    #theme-picker-layout-comparison .mint .swatch:nth-child(3) { background: #4f8f78; }
    #theme-picker-layout-comparison .lavender .swatch:nth-child(1) { background: #f8f5ff; }
    #theme-picker-layout-comparison .lavender .swatch:nth-child(2) { background: #e8e1fa; }
    #theme-picker-layout-comparison .lavender .swatch:nth-child(3) { background: #7567a8; }
    #theme-picker-layout-comparison .peach .swatch:nth-child(1) { background: #fff7f1; }
    #theme-picker-layout-comparison .peach .swatch:nth-child(2) { background: #f7dfd1; }
    #theme-picker-layout-comparison .peach .swatch:nth-child(3) { background: #a96545; }
    #theme-picker-layout-comparison .sky .swatch:nth-child(1) { background: #f2f8fd; }
    #theme-picker-layout-comparison .sky .swatch:nth-child(2) { background: #d9eaf7; }
    #theme-picker-layout-comparison .sky .swatch:nth-child(3) { background: #507fa5; }
    #theme-picker-layout-comparison .list-picker {
      overflow: hidden;
      border: 1px solid #dce5e1;
      border-radius: 14px;
      background: #ffffff;
    }
    #theme-picker-layout-comparison .theme-row {
      display: grid;
      grid-template-columns: 1fr auto 24px;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 0 12px;
      border: 0;
      border-bottom: 1px solid #edf1ef;
      color: #263a32;
      background: #ffffff;
      text-align: left;
    }
    #theme-picker-layout-comparison .theme-row:last-child { border-bottom: 0; }
    #theme-picker-layout-comparison .row-palette { display: flex; gap: 4px; }
    #theme-picker-layout-comparison .row-palette .swatch { width: 18px; height: 18px; border-radius: 50%; }
    #theme-picker-layout-comparison .row-check { color: #4f8f78; font-weight: 500; text-align: center; }
    #theme-picker-layout-comparison .large-preview {
      padding: 13px;
      border-radius: 16px;
      background: #f2fbf7;
    }
    #theme-picker-layout-comparison .mini-total { color: #5f746b; font-size: 12px; }
    #theme-picker-layout-comparison .mini-amount { margin: 5px 0 12px; color: #17352b; font-weight: 500; }
    #theme-picker-layout-comparison .mini-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 9px;
      border-radius: 11px;
      background: #ffffff;
    }
    #theme-picker-layout-comparison .mini-calendar span {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      color: #53675e;
      font-size: 11px;
    }
    #theme-picker-layout-comparison .mini-calendar span.active { color: #ffffff; background: #4f8f78; }
    #theme-picker-layout-comparison .dot-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 13px;
    }
    #theme-picker-layout-comparison .theme-dot {
      display: grid;
      justify-items: center;
      gap: 5px;
      padding: 8px 2px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #52665d;
      background: transparent;
      font-size: 11px;
    }
    #theme-picker-layout-comparison .theme-dot.selected { border-color: #4f8f78; background: #ffffff; }
    #theme-picker-layout-comparison .dot { width: 28px; height: 28px; border-radius: 50%; }
    #theme-picker-layout-comparison .dot.mint { background: #4f8f78; }
    #theme-picker-layout-comparison .dot.lavender { background: #7567a8; }
    #theme-picker-layout-comparison .dot.peach { background: #a96545; }
    #theme-picker-layout-comparison .dot.sky { background: #507fa5; }
    #theme-picker-layout-comparison .nav {
      position: absolute;
      left: 50%;
      bottom: 13px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 76%;
      min-height: 52px;
      transform: translateX(-50%);
      border: 1px solid #d9e1dd;
      border-radius: 999px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 8px 20px rgba(21,32,28,.16);
    }
    #theme-picker-layout-comparison .nav span { display: grid; place-items: center; color: #69766f; }
    #theme-picker-layout-comparison .nav span.active { margin: 5px; border-radius: 999px; color: #173c30; background: #dfeee8; }
    #theme-picker-layout-comparison .nav i { width: 20px; height: 20px; }
    #theme-picker-layout-comparison .choose {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 1px solid light-dark(#cad8d2, #43504a);
      border-radius: 12px;
      color: var(--ym-text);
      background: var(--ym-surface);
      font: inherit;
      font-weight: 500;
    }
    #theme-picker-layout-comparison .candidate.is-selected .choose { color: #ffffff; border-color: #4f8f78; background: #4f8f78; }
    #theme-picker-layout-comparison .selection-status { margin: 14px 0 0; color: var(--ym-muted); text-align: center; }
    @media (max-width: 760px) {
      #theme-picker-layout-comparison .comparison { grid-template-columns: 1fr; }
      #theme-picker-layout-comparison .candidate { max-width: 390px; margin: 0 auto; width: 100%; }
    }
  </style><style>#theme-picker-layout-comparison .candidate{max-width:410px;margin:auto}#theme-picker-layout-comparison .nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}</style><h2 style="text-align:center">테마 변경 · 확정 B안</h2><section class="candidate" data-choice="B">
      <div class="candidate-head"><span class="letter">B</span><strong>한 줄 목록</strong></div>
      <div class="phone" aria-label="한 줄 목록 방식">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="app-head">테마 변경</div>
        <div class="app-body">
          <p class="current-label">테마</p>
          <div class="list-picker">
            <button class="theme-row"><span>민트</span><span class="row-palette mint"><span class="swatch"></span><span class="swatch"></span><span class="swatch"></span></span><span class="row-check">✓</span></button>
            <button class="theme-row"><span>라벤더</span><span class="row-palette lavender"><span class="swatch"></span><span class="swatch"></span><span class="swatch"></span></span><span></span></button>
            <button class="theme-row"><span>피치</span><span class="row-palette peach"><span class="swatch"></span><span class="swatch"></span><span class="swatch"></span></span><span></span></button>
            <button class="theme-row"><span>스카이</span><span class="row-palette sky"><span class="swatch"></span><span class="swatch"></span><span class="swatch"></span></span><span></span></button>
          </div>
        </div>
        <div class="nav"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20V8"/></svg></span><span class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></span></div>
      </div>
      
    </section></div>
</body></html>
